name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
      tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
    tags:
      - 'v*.*.*'

jobs : 
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
      
      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Set Docker tags
        id: docker-tags
        run: |
          echo "IMAGE_TAG=react-app:${GITHUB_SHA}" >> $GITHUB_ENV
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "IMAGE_TAG=react-app:${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi
      
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-react-app:${{ env.DOCKER_TAG }} .
      
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-react-app:${{ env.DOCKER_TAG }}